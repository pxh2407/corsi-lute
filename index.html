<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I Corsi della LUTE</title>
<style>
  :root {
    --sfondo: #f4f4f2; --carta: #ffffff; --bordo: #dcdcd8;
    --testo: #1a1a1a; --tenue: #5a5a5a;
    --verde: #1b5e3f; --verde-chiaro: #e8f2ec; --oro: #a8842c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sfondo: #16181a; --carta: #212426; --bordo: #34383b;
      --testo: #f2f2f0; --tenue: #b4b4b0;
      --verde: #5fbf8f; --verde-chiaro: #1e2f27; --oro: #d2ad5e;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--sfondo); color: var(--testo);
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    font-size: 18px; line-height: 1.5;
  }
  header { padding: 32px 28px 18px; max-width: 1500px; margin: 0 auto; }
  h1 { font-size: 34px; font-weight: 600; letter-spacing: -0.5px; }
  .sottotitolo { color: var(--tenue); font-size: 18px; margin-top: 6px; }
  .barra {
    max-width: 1500px; margin: 0 auto; padding: 0 28px 20px;
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  }
  #cerca {
    flex: 1 1 320px; padding: 13px 16px; font-size: 18px; font-family: inherit;
    color: var(--testo); background: var(--carta);
    border: 2px solid var(--bordo); border-radius: 10px;
  }
  #cerca:focus { outline: none; border-color: var(--verde); }
  .conteggio { color: var(--tenue); font-size: 17px; }

  .area { max-width: 1500px; margin: 0 auto; padding: 18px 28px 0; }
  .area h2 {
    font-size: 23px; font-weight: 600; color: var(--verde);
    border-bottom: 2px solid var(--oro); padding-bottom: 8px; margin-bottom: 4px;
  }
  .area .quanti { color: var(--tenue); font-size: 16px; margin-bottom: 18px; }

  .griglia {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 22px; padding-bottom: 14px;
  }
  .corso {
    background: var(--carta); border: 1px solid var(--bordo); border-radius: 14px;
    overflow: hidden; text-align: left; font: inherit; color: inherit; padding: 0;
    display: flex; flex-direction: column; transition: border-color .15s, transform .15s;
  }
  button.corso { cursor: pointer; }
  button.corso:hover, button.corso:focus-visible {
    border-color: var(--verde); transform: translateY(-3px); outline: none;
  }
  .corso img {
    width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block;
    background: var(--verde-chiaro);
  }
  /* riquadro per i corsi che non hanno ancora un'immagine */
  .senza-foto {
    aspect-ratio: 16/9; background: var(--verde-chiaro);
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 16px;
    color: var(--verde); font-size: 16px; font-weight: 600;
    border-bottom: 1px dashed var(--bordo);
  }
  .testo { padding: 15px 18px 18px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .titolo { font-size: 20px; font-weight: 600; line-height: 1.3; }
  .docente { color: var(--tenue); font-size: 17px; }
  .vuoto { font-style: italic; }
  .piede { margin-top: auto; display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  .etichetta {
    background: var(--verde-chiaro); color: var(--verde);
    font-size: 15px; font-weight: 600; padding: 4px 10px; border-radius: 7px;
  }
  .manca {
    background: transparent; color: var(--tenue); border: 1px dashed var(--bordo);
    font-size: 14px; padding: 3px 9px; border-radius: 7px;
  }

  #galleria {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: #0c0c0c; color: #fff; flex-direction: column;
  }
  #galleria.aperta { display: flex; }
  .g-alto { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; gap: 16px; flex-shrink: 0; }
  .g-posizione { font-size: 17px; color: #c9c9c9; }
  .g-chiudi {
    background: none; border: 2px solid #6a6a6a; color: #fff; font: inherit;
    font-size: 17px; font-weight: 600; padding: 8px 20px; border-radius: 9px; cursor: pointer;
  }
  .g-chiudi:hover { border-color: #fff; }
  .g-centro { flex: 1; min-height: 0; display: flex; align-items: center; gap: 12px; padding: 0 12px; }
  .g-freccia {
    flex-shrink: 0; width: 62px; height: 92px; background: rgba(255,255,255,.10);
    border: none; color: #fff; font-size: 34px; line-height: 1; border-radius: 12px; cursor: pointer;
  }
  .g-freccia:hover { background: rgba(255,255,255,.22); }
  .g-freccia:disabled { opacity: .25; cursor: default; }
  .g-cornice { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #gImg { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 10px; display: block; }
  .g-basso { padding: 16px 24px 26px; text-align: center; flex-shrink: 0; }
  .g-titolo { font-size: 28px; font-weight: 600; }
  .g-docente { font-size: 19px; color: #c9c9c9; margin-top: 4px; }

  @media (max-width: 560px) {
    header { padding: 22px 18px 12px; }
    h1 { font-size: 27px; }
    .barra, .area { padding-left: 18px; padding-right: 18px; }
    .g-freccia { width: 46px; height: 74px; font-size: 27px; }
    .g-titolo { font-size: 22px; }
  }
</style>

<body>

<header>
  <h1>I Corsi della LUTE</h1>
  <div class="sottotitolo">Anno accademico 2026-2027 &middot; 53 corsi in 8 aree, tutti con la loro immagine. Clicca una scheda con foto per vederla a tutto schermo.</div>
</header>

<div class="barra">
  <input id="cerca" type="search" placeholder="Cerca un corso, un docente o un'area&hellip;" autocomplete="off">
  <span class="conteggio" id="conteggio"></span>
</div>

<div id="elenco"></div>

<div id="galleria" role="dialog" aria-modal="true" aria-label="Immagine del corso">
  <div class="g-alto">
    <span class="g-posizione" id="gPosizione"></span>
    <button class="g-chiudi" id="gChiudi" type="button">Chiudi</button>
  </div>
  <div class="g-centro">
    <button class="g-freccia" id="gPrec" type="button" aria-label="Precedente">&#8249;</button>
    <div class="g-cornice"><img id="gImg" alt=""></div>
    <button class="g-freccia" id="gSucc" type="button" aria-label="Successivo">&#8250;</button>
  </div>
  <div class="g-basso">
    <div class="g-titolo" id="gTitolo"></div>
    <div class="g-docente" id="gDocente"></div>
  </div>
</div>

const elenco = document.getElementById('elenco');
const conteggio = document.getElementById('conteggio');
const galleria = document.getElementById('galleria');
let conFoto = [];     // solo i corsi con immagine, per scorrere la galleria
let posizione = 0;

function disegna(lista) {
  elenco.innerHTML = '';
  const aree = [...new Set(lista.map(c => c.area))];
  aree.forEach(a => {
    const dentro = lista.filter(c => c.area === a);
    const sez = document.createElement('div');
    sez.className = 'area';
    const senza = dentro.filter(c => !c.img).length;
    sez.innerHTML = '<h2>' + a + '</h2><div class="quanti">' + dentro.length +
      (dentro.length === 1 ? ' corso' : ' corsi') +
      (senza ? ' &middot; ' + senza + (senza === 1 ? ' senza foto' : ' senza foto') : '') + '</div>';
    const g = document.createElement('div');
    g.className = 'griglia';
    dentro.forEach(c => {
      const el = document.createElement(c.img ? 'button' : 'div');
      el.className = 'corso';
      if (c.img) el.type = 'button';
      const testa = c.img
        ? '<img src="' + c.img + '" alt="' + c.nome.replace(/"/g, '&quot;') + '" loading="lazy">'
        : '<div class="senza-foto">foto non ancora disponibile</div>';
      el.innerHTML = testa +
        '<div class="testo">' +
          '<div class="titolo">' + c.nome + '</div>' +
          (c.doc ? '<div class="docente">' + c.doc + '</div>'
                 : '<div class="docente vuoto">docente non indicato</div>') +
          '<div class="piede"><span class="etichetta">n. ' + c.cod + '</span>' +
            (c.img ? '' : '<span class="manca">manca la foto</span>') +
          '</div>' +
        '</div>';
      if (c.img) el.onclick = () => apri(c);
      g.appendChild(el);
    });
    sez.appendChild(g);
    elenco.appendChild(sez);
  });
  conFoto = lista.filter(c => c.img);
  const n = lista.length;
  conteggio.textContent = (n === CORSI.length)
    ? CORSI.length + ' corsi, ' + CORSI.filter(c => c.img).length + ' con foto'
    : n + ' corsi su ' + CORSI.length;
}

function mostra() {
  const c = conFoto[posizione];
  document.getElementById('gImg').src = c.img;
  document.getElementById('gImg').alt = c.nome;
  document.getElementById('gTitolo').textContent = c.nome;
  document.getElementById('gDocente').textContent =
    (c.doc ? c.doc : 'docente non indicato') + '  \u2022  corso n. ' + c.cod;
  document.getElementById('gPosizione').textContent = (posizione + 1) + ' di ' + conFoto.length;
  document.getElementById('gPrec').disabled = posizione === 0;
  document.getElementById('gSucc').disabled = posizione === conFoto.length - 1;
}
function apri(c) {
  posizione = conFoto.indexOf(c);
  mostra();
  galleria.classList.add('aperta');
  document.body.style.overflow = 'hidden';
  document.getElementById('gChiudi').focus();
}
function chiudi() { galleria.classList.remove('aperta'); document.body.style.overflow = ''; }
function scorri(p) { const n = posizione + p; if (n < 0 || n >= conFoto.length) return; posizione = n; mostra(); }

document.getElementById('gChiudi').onclick = chiudi;
document.getElementById('gPrec').onclick = () => scorri(-1);
document.getElementById('gSucc').onclick = () => scorri(1);
galleria.addEventListener('click', e => { if (e.target === galleria) chiudi(); });
document.addEventListener('keydown', e => {
  if (!galleria.classList.contains('aperta')) return;
  if (e.key === 'Escape') chiudi();
  if (e.key === 'ArrowLeft') scorri(-1);
  if (e.key === 'ArrowRight') scorri(1);
});
document.getElementById('cerca').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  disegna(q ? CORSI.filter(c =>
    c.nome.toLowerCase().includes(q) || c.doc.toLowerCase().includes(q) ||
    c.area.toLowerCase().includes(q) || c.cod.includes(q)) : CORSI);
});

disegna(CORSI);
</script>
